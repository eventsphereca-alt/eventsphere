<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | EventSphere</title>
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/app.js"></script>
  </head>
  <body data-page="login">
    <div class="shell">
      <header class="site-header">
        <div class="container header-row">
          <a class="brand" href="/"><span class="brand-mark">ES</span><span>EventSphere</span></a>
          <nav class="nav">
            <a href="/">Home</a>
            <a href="/vendors">Browse Vendors</a>
          </nav>
          <div class="actions">
            <a class="button secondary" href="/register">List Your Business</a>
          </div>
        </div>
      </header>

      <main class="auth-wrap">
        <form class="auth-card" data-login-form>
          <div>
            <h1>Welcome back</h1>
            <p>Use the seeded vendor or admin account to test the live dashboard flows.</p>
          </div>
          <div class="message">
            <strong>Vendor demo:</strong> vendor@eventsphere.ca / demo123<br />
            <strong>Admin demo:</strong> admin@eventsphere.ca / demo123
          </div>
          <div class="form-grid">
            <div class="field">
              <label>Email</label>
              <input required type="email" name="email" placeholder="name@example.com" />
            </div>
            <div class="field">
              <label>Password</label>
              <input required type="password" name="password" placeholder="demo123" />
            </div>
          </div>
          <button class="button" type="submit">Sign in</button>
          <p class="form-hint">Need a vendor account? <a href="/register">Create one</a></p>
          <div class="mini" data-form-message></div>
        </form>
      </main>
    </div>
  </body>
</html>
